[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skeletonkey-toolforge"
version = "0.1.0"
description = "SkeletonKey / ToolForge v2 - adaptive dynamic toolset, skills, and MCP server for autopilot and autonomous agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Dime" }]
keywords = ["mcp", "model-context-protocol", "agents", "toolset", "skills", "autopilot", "shell"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
]

# The core is deliberately dependency-free (see ADR-0001). Only the MCP
# transport and optional accelerators pull in third-party code, so the toolkit
# stays installable inside locked-down agent sandboxes.
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.1,<3"]
watch = ["watchfiles>=0.21"]
all = ["skeletonkey-toolforge[mcp,watch]"]
dev = [
  "skeletonkey-toolforge[all]",
  "pytest>=8",
  "pytest-asyncio>=1.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
sk = "skeletonkey.cli:main"
skeletonkey-mcp = "skeletonkey.mcp.__main__:main"

[project.entry-points."skeletonkey.tools"]
# Third-party packages can ship tools by adding an entry-point group.
# name = "package.module:TOOL_SPECS"

[tool.hatch.build.targets.wheel]
packages = ["skeletonkey"]

[tool.hatch.build.targets.sdist]
include = ["skeletonkey", "schemas", "skills", "docs", "tests", "config", "PLAN.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
  "posix: test requires a POSIX shell (bash/sh)",
  "win: test requires Windows or PowerShell",
  "slow: longer-running integration test",
]
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "RUF"]
ignore = ["E501", "RET504", "SIM105", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Shell/PowerShell fixtures are verbatim dialect text; unicode rules don't apply.
"tests/*" = ["B011"]
"skeletonkey/shells/dialect.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
